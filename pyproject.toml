[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parazettel-mcp"
version = "0.5.1.1"
description = "A Zettelkasten + GTD/PARA knowledge and action management MCP server"
authors = [
    {name = "Peter J. Herrel", email = "peterherrel@protonmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "tomli; python_version < '3.11'",
    "kuzu>=0.11.3,<0.12",
    "pydantic>=2.0.0",
    "python-frontmatter>=1.0.0",
    "markdown>=3.4.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]
migration = [
    "sqlalchemy>=2.0.0",
]
# Optional semantic embeddings (PARAZETTEL_EMBEDDING_ENABLED=true). Two tiers:
# "lite" = fastembed (ONNX, no PyTorch — small, fast, recommended default);
# full   = sentence-transformers (PyTorch — widest model support incl.
# EmbeddingGemma, which needs a recent release). Neither is needed while
# embeddings are disabled or the "hash" provider is used.
embeddings-lite = [
    "fastembed>=0.4.0",
]
# Lite tier on the GPU: fastembed-gpu pulls onnxruntime-gpu, and the nvidia-*
# wheels supply the CUDA 12 / cuDNN 9 runtime so no system CUDA toolkit is
# needed (the provider calls onnxruntime.preload_dlls() to locate them). The
# CUDA 12 build runs on newer CUDA drivers. Set PARAZETTEL_EMBEDDING_DEVICE=cuda.
embeddings-lite-gpu = [
    "fastembed-gpu>=0.4.0",
    "nvidia-cudnn-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cublas-cu12",
    "nvidia-cufft-cu12",
    "nvidia-curand-cu12",
]
embeddings = [
    "sentence-transformers>=5.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.isort]
profile = "black"
line_length = 88

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Optional embedding backends are lazy-imported and only present with the
# [embeddings] / [embeddings-lite] extras; don't fail type-checking on them.
[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
